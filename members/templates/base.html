{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}Online Bookstore{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>
<div id="navbar"
     data-main-url="{% url 'main' %}"
     data-cart-url="{% url 'cart' %}"
     data-orders-url="{% url 'orders' %}"
     data-login-url="{% url 'login' %}"
     data-signup-url="{% url 'signup' %}"
     data-logout-url="{% url 'logout' %}"
     data-cart-count="{{ cart_count|default:0 }}"
     data-users-url="{% url 'show_users' %}"
     data-product-url="{% url 'product' %}"
     data-category-url="{% url 'product_category' %}"
     data-product-update-page-url="{% url 'product_update_page' %}"
     data-authenticated="{% if user.is_authenticated %}true{% else %}false{% endif %}"
     data-user-name="{{ user.first_name|default:user.username }}"
     data-is-admin="{% if user.is_superuser %}true{% else %}false{% endif %}">
</div>

{% block content %}{% endblock %}

<div id="modalRoot"></div>

<script src="{% static 'js/store.js' %}?v=5"></script>
<script src="{% static 'js/data.js' %}?v=5"></script>
<script src="{% static 'js/navbar.js' %}?v=5"></script>
{% block scripts %}{% endblock %}
</body>
</html>
